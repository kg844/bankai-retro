<svg xmlns="http://www.w3.org/2000/svg" width="700" height="880" viewBox="0 0 700 880" font-family="Arial, sans-serif">
  <rect width="700" height="880" fill="#ffffff"/>

  <!-- Header / nav -->
  <rect x="20" y="20" width="660" height="55" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="35" y="52" font-size="12">LOGO</text>
  <text x="565" y="52" font-size="11" text-anchor="middle">Home  About  Products  Enquiry  Contact</text>

  <!-- Page title + filter -->
  <text x="20" y="110" font-size="16">Shop Kits by Club &amp; Era</text>
  <rect x="480" y="88" width="200" height="28" fill="none" stroke="#000"/>
  <text x="580" y="107" font-size="10" text-anchor="middle">[ filter: club / era ]</text>

  <!-- Product grid: 3 columns x 3 rows -->
  <g stroke="#000" stroke-width="1.5" fill="none">
    <rect x="20" y="140" width="200" height="210"/>
    <rect x="240" y="140" width="200" height="210"/>
    <rect x="460" y="140" width="200" height="210"/>
    <rect x="20" y="370" width="200" height="210"/>
    <rect x="240" y="370" width="200" height="210"/>
    <rect x="460" y="370" width="200" height="210"/>
    <rect x="20" y="600" width="200" height="210"/>
    <rect x="240" y="600" width="200" height="210"/>
    <rect x="460" y="600" width="200" height="210"/>
  </g>

  <!-- image placeholders (dashed) -->
  <g stroke="#999" stroke-dasharray="3" fill="none">
    <rect x="35" y="155" width="170" height="120"/>
    <rect x="255" y="155" width="170" height="120"/>
    <rect x="475" y="155" width="170" height="120"/>
    <rect x="35" y="385" width="170" height="120"/>
    <rect x="255" y="385" width="170" height="120"/>
    <rect x="475" y="385" width="170" height="120"/>
    <rect x="35" y="615" width="170" height="120"/>
    <rect x="255" y="615" width="170" height="120"/>
    <rect x="475" y="615" width="170" height="120"/>
  </g>

  <g font-size="10" fill="#555" text-anchor="middle">
    <text x="120" y="310">kit name / price</text>
    <text x="340" y="310">kit name / price</text>
    <text x="560" y="310">kit name / price</text>
    <text x="120" y="540">kit name / price</text>
    <text x="340" y="540">kit name / price</text>
    <text x="560" y="540">kit name / price</text>
    <text x="120" y="770">kit name / price</text>
    <text x="340" y="770">kit name / price</text>
    <text x="560" y="770">kit name / price</text>
  </g>

  <text x="20" y="840" font-size="12">Low-fidelity wireframe — Products page (grid layout)</text>
</svg>
