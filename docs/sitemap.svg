<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" font-family="Arial, sans-serif">
  <rect width="760" height="380" fill="#ffffff"/>

  <!-- Root: Homepage -->
  <rect x="310" y="20" width="140" height="45" fill="none" stroke="#000" stroke-width="1.5"/>
  <text x="380" y="47" font-size="13" text-anchor="middle">Home (index.html)</text>

  <!-- Vertical trunk down from home -->
  <line x1="380" y1="65" x2="380" y2="95" stroke="#000" stroke-width="1.5"/>
  <!-- Horizontal branch connecting the 4 children -->
  <line x1="90" y1="95" x2="670" y2="95" stroke="#000" stroke-width="1.5"/>
  <!-- Drops down to each child box -->
  <line x1="90" y1="95" x2="90" y2="115" stroke="#000" stroke-width="1.5"/>
  <line x1="285" y1="95" x2="285" y2="115" stroke="#000" stroke-width="1.5"/>
  <line x1="475" y1="95" x2="475" y2="115" stroke="#000" stroke-width="1.5"/>
  <line x1="670" y1="95" x2="670" y2="115" stroke="#000" stroke-width="1.5"/>

  <!-- Child pages -->
  <g font-size="12" text-anchor="middle">
    <rect x="20" y="115" width="140" height="42" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="90" y="141">About Us</text>
    <text x="90" y="153" font-size="9" fill="#555">about.html</text>

    <rect x="215" y="115" width="140" height="42" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="285" y="141">Products</text>
    <text x="285" y="153" font-size="9" fill="#555">products.html</text>

    <rect x="405" y="115" width="140" height="42" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="475" y="141">Enquiry</text>
    <text x="475" y="153" font-size="9" fill="#555">enquiry.html</text>

    <rect x="600" y="115" width="140" height="42" fill="none" stroke="#000" stroke-width="1.5"/>
    <text x="670" y="141">Contact</text>
    <text x="670" y="153" font-size="9" fill="#555">contact.html</text>
  </g>

  <!-- Notes -->
  <text x="20" y="220" font-size="12" fill="#000">Notes:</text>
  <text x="20" y="240" font-size="11" fill="#333">- Every page includes the same nav menu, linking to all 5 pages.</text>
  <text x="20" y="258" font-size="11" fill="#333">- Products page lists kits by club/era; filtering added in a later part.</text>
  <text x="20" y="276" font-size="11" fill="#333">- Enquiry page form fields: name, email, enquiry type, details.</text>
  <text x="20" y="294" font-size="11" fill="#333">- Contact page lists two physical locations plus email/social links.</text>

  <text x="20" y="340" font-size="13" fill="#000">Bankai Retro — Sitemap (Part 1)</text>
</svg>
